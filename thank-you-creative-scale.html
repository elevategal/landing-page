<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>המקום שלך שמור | סדנת קריאייטיב סקייל</title>

    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #F3EFE7;
            --bg-card: #1A1A2E;
            --text-primary: #000000;
            --accent: #8C52FF;
            --accent-hover: #A370FF;
            --green-accent: #2E7D32;
            --radius: 12px;
            --radius-lg: 20px;
            --brutal-shadow: 6px 6px 0 #000;
            --brutal-shadow-sm: 4px 4px 0 #000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            background-image:
                linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 16px;
            font-weight: 700;
            overflow-x: hidden;
        }

        .container { max-width: 640px; margin: 0 auto; padding: 0 24px; }
        .page { padding: 56px 0 64px; text-align: center; }

        h1, h2 { line-height: 1.2; font-weight: 900; letter-spacing: -0.01em; }

        /* ===== CONFIRMATION ===== */
        .check-circle {
            width: 84px; height: 84px; margin: 0 auto 22px;
            border-radius: 50%; background: var(--green-accent); color: #fff;
            border: 2px solid #000; box-shadow: var(--brutal-shadow-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.6rem; font-weight: 900; line-height: 1;
        }
        h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); margin-bottom: 14px; }
        .subtitle {
            font-size: clamp(1rem, 2.6vw, 1.15rem);
            font-weight: 700; line-height: 1.7; max-width: 480px; margin: 0 auto;
        }

        .divider {
            width: 100%; max-width: 380px; height: 2px;
            background: rgba(0,0,0,0.12); border: 0;
            margin: 40px auto;
        }

        /* ===== INSTAGRAM ===== */
        h2 { font-size: clamp(1.25rem, 3.6vw, 1.7rem); margin-bottom: 14px; }
        .ig-text {
            font-size: clamp(0.95rem, 2.4vw, 1.05rem);
            font-weight: 700; line-height: 1.75;
            max-width: 500px; margin: 0 auto 28px;
        }

        /* The embed sizes itself; the wrapper just keeps it centred and capped.
           min-height reserves the space so the button below does not jump when
           Instagram's script finishes rendering. */
        .reel-wrap {
            max-width: 400px; margin: 0 auto 30px;
            min-height: 480px;
        }
        .reel-wrap .instagram-media { margin: 0 auto !important; }

        .cta-btn {
            display: inline-block; background: var(--accent); color: #fff;
            padding: 18px 36px; border-radius: var(--radius); font-size: 1.05rem;
            font-weight: 900; text-decoration: none; border: 2px solid #000;
            box-shadow: var(--brutal-shadow); font-family: inherit;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .cta-btn:hover { transform: translate(-2px,-2px); box-shadow: 8px 8px 0 #000; background: var(--accent-hover); }
        .cta-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #000; }

        .micro {
            margin-top: 30px; font-size: 0.9rem;
            font-weight: 700; opacity: 0.65;
        }

        @media (max-width: 768px) {
            .container { padding: 0 16px; }
            .page { padding: 40px 0 48px; }
            .check-circle { width: 70px; height: 70px; font-size: 2.2rem; margin-bottom: 18px; }
            .divider { margin: 30px auto; }
            .reel-wrap { min-height: 440px; }
            .cta-btn { width: 100%; max-width: 340px; padding: 16px 20px; font-size: 0.98rem; }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="container">
            <div class="check-circle" aria-hidden="true">&#10003;</div>
            <h1>המקום שלך שמור זמנית ✓</h1>
            <p class="subtitle">אני שולח לך הודעה בוואטסאפ בשעות הקרובות לסגירת ההרשמה.</p>

            <hr class="divider">

            <h2>עד שאני כותב לך - תראה איך זה נראה מבפנים.</h2>
            <p class="ig-text">
                באינסטגרם אני מפרק מודעות אמיתיות - מה עובד, מה שורף כסף, ולמה.<br>
                ככה תגיע לסדנה כשאתה כבר מדבר את השפה.
            </p>

            <div class="reel-wrap">
                <!-- TODO: paste the official Instagram embed here, exactly as copied from
                     the post (the full <blockquote class="instagram-media"> block).
                     The embed.js script tag is already loaded at the bottom of this page,
                     so drop only the blockquote in - do not add a second script tag. -->
            </div>

            <a class="cta-btn" href="https://www.instagram.com/gal_creativz" target="_blank" rel="noopener">לעוד פירוקים - @gal_creativz ←</a>

            <p class="micro">נתראה בסדנה. 6-7.9, בזום.</p>
        </div>
    </main>

    <!-- Instagram embed renderer. async so it never blocks the confirmation above. -->
    <script async src="https://www.instagram.com/embed.js"></script>

    <script>
        // Meta Pixel - PageView only. The Lead event fires on the form page before
        // the redirect, so firing one here would double-count every registration.
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1265390459065125');
        fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1265390459065125&ev=PageView&noscript=1"></noscript>
</body>
</html>
