<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>עוד לא הזמן</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;800&display=swap" rel="stylesheet">

<style>
  :root{--ink:#111111;--muted:#6B7280;--blue:#2563EB;--blue-dark:#1D4ED8;--line:#E5E7EB;--wrap:720px}
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;background:#FFFFFF;color:var(--ink);
    font-family:"Heebo",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px;text-align:center}
  section{padding:80px 0 56px}
  h1{
    font-weight:800;font-size:clamp(30px,4.6vw,42px);line-height:1.15;
    letter-spacing:-0.02em;margin:0;text-wrap:balance;
  }
  p{font-size:18px;line-height:1.7;color:var(--muted);margin:24px auto 0;max-width:560px;text-wrap:pretty}
  p b{color:var(--ink);font-weight:800}
  .cta{
    display:block;width:100%;max-width:420px;margin:40px auto 0;
    background:var(--blue);color:#FFFFFF;font-weight:800;font-size:18px;
    line-height:1.3;text-align:center;text-decoration:none;border:0;border-radius:8px;
    padding:19px 24px;transition:background .15s ease;
  }
  .cta:hover{background:var(--blue-dark)}
  footer{border-top:1px solid var(--line);padding:32px 0 48px}
  footer p{font-size:14px;color:var(--muted);margin:0}
  footer a{color:inherit;text-decoration:underline;text-underline-offset:3px}
  @media (max-width:700px){
    section{padding:56px 0 44px}
    p{font-size:17px}
    .cta{font-size:17px;padding:18px 20px}
  }
</style>
</head>
<body>

<section>
  <div class="wrap">
    <h1>עוד לא הזמן לליווי</h1>
    <p>אבל מה שראית בסרטון קורה גם אצלך. יש סדנה של שעה וחצי שבה אני מראה את זה על הלוח, עם דוגמאות. <b>97 שקל.</b></p>

    <!-- החלף את ה-href בכתובת של דף הסדנה -->
    <a class="cta" href="#">לסדנה</a>
  </div>
</section>

<footer>
  <div class="wrap">
    <p>Elev8 · כל הזכויות שמורות · <a href="accessibility.html">הצהרת נגישות</a></p>
  </div>
</footer>

<script src="accessibility-widget.js" defer></script>

</body>
</html>
